# GÉNÉRÉ par scripts/extract-contracts depuis automaton — ne pas éditer.
# Pour le changer : modifier le code de automaton, puis régénérer.
$schema: https://json-schema.org/draft/2020-12/schema
title: GameCommand
$defs:
  Characteristics:
    additionalProperties: false
    description: Les caractéristiques d'un joueur, ou leurs modificateurs.
    properties:
      MA:
        title: Ma
        type: integer
      ST:
        title: St
        type: integer
      AG:
        title: Ag
        type: integer
      PA:
        title: Pa
        type: integer
      AV:
        title: Av
        type: integer
    required:
    - MA
    - ST
    - AG
    - PA
    - AV
    title: Characteristics
    type: object
  ChooseKickOff:
    additionalProperties: false
    description: Le gagnant du tir au dé choisit d'engager ou de réceptionner.
    properties:
      type:
        const: choose_kick_off
        default: choose_kick_off
        title: Type
        type: string
      choice:
        enum:
        - kick
        - receive
        title: Choice
        type: string
    required:
    - choice
    title: ChooseKickOff
    type: object
  CoachID:
    anyOf:
    - maxLength: 26
      minLength: 26
      pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
      type: string
    - format: binary
      maxLength: 16
      minLength: 16
      type: string
  CoachRecord:
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/CoachID'
      name:
        $ref: '#/$defs/NonEmpty'
    required:
    - id
    - name
    title: CoachRecord
    type: object
  CompetitionRecord:
    additionalProperties: false
    properties:
      id:
        title: Id
        type: string
      name:
        title: Name
        type: string
      season:
        title: Season
        type: string
    required:
    - id
    - name
    - season
    title: CompetitionRecord
    type: object
  DedicatedFans:
    maximum: 7
    minimum: 1
    type: integer
  EndSetUp:
    additionalProperties: false
    description: Le coach valide sa formation.
    properties:
      type:
        const: end_set_up
        default: end_set_up
        title: Type
        type: string
    title: EndSetUp
    type: object
  GiveBall:
    additionalProperties: false
    description: 'Remise en jeu : le coach qui réceptionne donne le ballon à un de ses

      joueurs sur le terrain.'
    properties:
      type:
        const: give_ball
        default: give_ball
        title: Type
        type: string
      player_id:
        $ref: '#/$defs/PlayerID'
    required:
    - player_id
    title: GiveBall
    type: object
  JoinGame:
    additionalProperties: false
    properties:
      type:
        const: join_game
        default: join_game
        title: Type
        type: string
      coach_id:
        $ref: '#/$defs/CoachID'
    required:
    - coach_id
    title: JoinGame
    type: object
  KickOff:
    additionalProperties: false
    description: Le coach qui engage désigne la case de la moitié adverse où il vise.
    properties:
      type:
        const: kick_off
        default: kick_off
        title: Type
        type: string
      square:
        $ref: '#/$defs/Square'
    required:
    - square
    title: KickOff
    type: object
  NonEmpty:
    minLength: 1
    type: string
  PlacePlayer:
    additionalProperties: false
    description: Le coach pose un joueur de son équipe sur une case, ou l'y déplace.
    properties:
      type:
        const: place_player
        default: place_player
        title: Type
        type: string
      player_id:
        $ref: '#/$defs/PlayerID'
      square:
        $ref: '#/$defs/Square'
    required:
    - player_id
    - square
    title: PlacePlayer
    type: object
  PlayerID:
    anyOf:
    - maxLength: 26
      minLength: 26
      pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
      type: string
    - format: binary
      maxLength: 16
      minLength: 16
      type: string
  PlayerRecord:
    additionalProperties: false
    description: Un joueur de la fiche.
    properties:
      id:
        $ref: '#/$defs/PlayerID'
      jersey:
        title: Jersey
        type: integer
      name:
        anyOf:
        - type: string
        - type: 'null'
        title: Name
      position:
        $ref: '#/$defs/PositionRecord'
      stats:
        $ref: '#/$defs/Characteristics'
      stat_modifiers:
        $ref: '#/$defs/Characteristics'
      skills:
        items:
          $ref: '#/$defs/SkillRecord'
        title: Skills
        type: array
      spp:
        $ref: '#/$defs/SppRecord'
      value_kpo:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Value Kpo
      niggling_injuries:
        title: Niggling Injuries
        type: integer
      journeyman:
        title: Journeyman
        type: boolean
      available:
        title: Available
        type: boolean
      status:
        $ref: '#/$defs/PlayerStatus'
    required:
    - id
    - jersey
    - name
    - position
    - stats
    - stat_modifiers
    - skills
    - spp
    - niggling_injuries
    - journeyman
    - available
    - status
    title: PlayerRecord
    type: object
  PlayerStatus:
    description: La participation d'un joueur au prochain match (Kreek).
    enum:
    - Available
    - MissingNextGame
    - Retired
    - Dead
    title: PlayerStatus
    type: string
  PositionRecord:
    additionalProperties: false
    properties:
      uid:
        title: Uid
        type: string
      name:
        title: Name
        type: string
      keywords:
        items:
          type: string
        title: Keywords
        type: array
    required:
    - uid
    - name
    - keywords
    title: PositionRecord
    type: object
  RecordTeamForGame:
    additionalProperties: false
    description: 'Réponse du système de gestion à fetch_team : la fiche Kreek d''une équipe.


      Porte l''équipe concernée : l''étape sait ainsi à quel camp elle revient,

      et la commande se lit seule dans le journal. `team_id` est celui de la

      fiche ; les bornes de l''équipe sont celles du modèle de fiche.'
    properties:
      type:
        const: record_team
        default: record_team
        title: Type
        type: string
      team_id:
        $ref: '#/$defs/TeamID'
      sheet:
        $ref: '#/$defs/TeamSheet'
    required:
    - team_id
    - sheet
    title: RecordTeamForGame
    type: object
  ReservePlayer:
    additionalProperties: false
    description: Le coach remet un joueur de son équipe dans le Box des Réserves.
    properties:
      type:
        const: reserve_player
        default: reserve_player
        title: Type
        type: string
      player_id:
        $ref: '#/$defs/PlayerID'
    required:
    - player_id
    title: ReservePlayer
    type: object
  RosterCode:
    $ref: '#/$defs/NonEmpty'
  RosterRecord:
    additionalProperties: false
    properties:
      uid:
        $ref: '#/$defs/RosterCode'
      name:
        $ref: '#/$defs/NonEmpty'
      tier:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Tier
      logo_url:
        $ref: '#/$defs/NonEmpty'
      special_rules:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        title: Special Rules
      reroll_cost_kpo:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Reroll Cost Kpo
    required:
    - uid
    - name
    - logo_url
    title: RosterRecord
    type: object
  SkillCategory:
    description: La catégorie d'une compétence (Kreek).
    enum:
    - GENERAL
    - AGILITY
    - STRENGTH
    - PASSING
    - DEVIOUS
    - MUTATIONS
    - TRAITS
    title: SkillCategory
    type: string
  SkillOrigin:
    description: La façon dont un joueur a acquis une compétence (Kreek).
    enum:
    - base
    - chosen
    - random
    - injury
    - customised
    title: SkillOrigin
    type: string
  SkillRecord:
    additionalProperties: false
    properties:
      uid:
        title: Uid
        type: string
      name:
        title: Name
        type: string
      category:
        $ref: '#/$defs/SkillCategory'
      origin:
        $ref: '#/$defs/SkillOrigin'
    required:
    - uid
    - name
    - category
    - origin
    title: SkillRecord
    type: object
  SppRecord:
    additionalProperties: false
    description: Les Points de Star Player d'un joueur.
    properties:
      earned:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Earned
      available:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Available
    title: SppRecord
    type: object
  Square:
    additionalProperties: false
    description: Une case du terrain, ou hors du terrain (voir on_pitch).
    properties:
      x:
        title: X
        type: integer
      y:
        title: Y
        type: integer
    required:
    - x
    - y
    title: Square
    type: object
  TeamID:
    anyOf:
    - maxLength: 26
      minLength: 26
      pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
      type: string
    - format: binary
      maxLength: 16
      minLength: 16
      type: string
  TeamRecord:
    additionalProperties: false
    description: La partie `team` de la fiche.
    properties:
      id:
        $ref: '#/$defs/TeamID'
      name:
        $ref: '#/$defs/NonEmpty'
      logo_url:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Logo Url
      coach:
        $ref: '#/$defs/CoachRecord'
      roster:
        $ref: '#/$defs/RosterRecord'
      competition:
        anyOf:
        - $ref: '#/$defs/CompetitionRecord'
        - type: 'null'
        default: null
      team_value_kpo:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Team Value Kpo
      current_team_value_kpo:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Current Team Value Kpo
      treasury_kpo:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Treasury Kpo
      dedicated_fans:
        $ref: '#/$defs/DedicatedFans'
      rerolls:
        title: Rerolls
        type: integer
      assistant_coaches:
        title: Assistant Coaches
        type: integer
      cheerleaders:
        title: Cheerleaders
        type: integer
      apothecary:
        title: Apothecary
        type: boolean
    required:
    - id
    - name
    - coach
    - roster
    - dedicated_fans
    - rerolls
    - assistant_coaches
    - cheerleaders
    - apothecary
    title: TeamRecord
    type: object
  TeamSheet:
    additionalProperties: false
    description: La fiche d'équipe entière, au format d'export Kreek.
    properties:
      schema_version:
        const: 1
        title: Schema Version
        type: integer
      edition:
        const: Blood Bowl 2025
        title: Edition
        type: string
      team:
        $ref: '#/$defs/TeamRecord'
      players:
        items:
          $ref: '#/$defs/PlayerRecord'
        maxItems: 16
        minItems: 1
        title: Players
        type: array
    required:
    - schema_version
    - edition
    - team
    - players
    title: TeamSheet
    type: object
discriminator:
  mapping:
    choose_kick_off: '#/$defs/ChooseKickOff'
    end_set_up: '#/$defs/EndSetUp'
    give_ball: '#/$defs/GiveBall'
    join_game: '#/$defs/JoinGame'
    kick_off: '#/$defs/KickOff'
    place_player: '#/$defs/PlacePlayer'
    record_team: '#/$defs/RecordTeamForGame'
    reserve_player: '#/$defs/ReservePlayer'
  propertyName: type
oneOf:
- $ref: '#/$defs/JoinGame'
- $ref: '#/$defs/RecordTeamForGame'
- $ref: '#/$defs/ChooseKickOff'
- $ref: '#/$defs/PlacePlayer'
- $ref: '#/$defs/ReservePlayer'
- $ref: '#/$defs/EndSetUp'
- $ref: '#/$defs/KickOff'
- $ref: '#/$defs/GiveBall'
