# GÉNÉRÉ par scripts/extract-contracts depuis automaton — ne pas éditer.
# Pour le changer : modifier le code de automaton, puis régénérer.
openapi: 3.1.0
info:
  title: Automaton
  version: 0.1.0
paths:
  /games:
    post:
      tags:
      - games
      summary: Create Game
      operationId: create_game_games_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGame'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCreated'
        '409':
          description: Match déjà démarré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /games/{game_id}/journal:
    get:
      tags:
      - games
      summary: Read Journal
      operationId: read_journal_games__game_id__journal_get
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            minLength: 26
            maxLength: 26
            pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
          - type: string
            contentMediaType: application/octet-stream
            minLength: 16
            maxLength: 16
          title: Game Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items: {}
                title: Response Read Journal Games  Game Id  Journal Get
        '404':
          description: Partie inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CoachID:
      anyOf:
      - type: string
        maxLength: 26
        minLength: 26
        pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
      - type: string
        maxLength: 16
        minLength: 16
        contentMediaType: application/octet-stream
    CreateGame:
      properties:
        home_coach:
          $ref: '#/components/schemas/CoachID'
        home_team:
          $ref: '#/components/schemas/TeamID'
        visitor_coach:
          $ref: '#/components/schemas/CoachID'
        visitor_team:
          $ref: '#/components/schemas/TeamID'
      additionalProperties: false
      type: object
      required:
      - home_coach
      - home_team
      - visitor_coach
      - visitor_team
      title: CreateGame
    ErrorBody:
      properties:
        detail:
          type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
      - detail
      title: ErrorBody
    GameCreated:
      properties:
        game_id:
          $ref: '#/components/schemas/GameID'
      additionalProperties: false
      type: object
      required:
      - game_id
      title: GameCreated
    GameID:
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TeamID:
      anyOf:
      - type: string
        maxLength: 26
        minLength: 26
        pattern: '[0-7][0123456789ABCDEFGHJKMNPQRSTVWXYZ]{25}'
      - type: string
        maxLength: 16
        minLength: 16
        contentMediaType: application/octet-stream
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
