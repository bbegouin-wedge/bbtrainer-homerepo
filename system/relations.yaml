# Les dépendances déclarées entre composants, et le contrat qui porte chacune.
# Une dépendance qui n'est pas ici n'existe pas : la créer, c'est l'ajouter ici
# (et son contrat dans contracts/), dans l'initiative qui l'introduit.
#
#   from / to     identifiants de system/components.yaml
#   role          consumes   from appelle ou écoute to
#                 implements from sert le même contrat que to (une doublure)
#                 reads      from lit des données publiées par to
#   contract      chemin sous contracts/, ou null si le contrat n'est pas
#                 encore formalisé (status: informal)
#   status        formal | informal | planned

relations:

  - id: client-plays-on-automaton
    from: bloodbowltrainer
    to: automaton
    role: consumes
    contract: events/match/coach-channel.asyncapi.yaml
    status: formal
    notes: >
      Le canal websocket du coach. bbTrainer en a sa propre lecture,
      docs/protocole-client-serveur.md (v0) : elle doit suivre ce contrat.

  - id: client-tests-on-testbackend
    from: bloodbowltrainer
    to: bb-testbackend
    role: consumes
    contract: events/match/coach-channel.asyncapi.yaml
    status: formal
    notes: >
      En développement et en CI, bbTrainer joue contre la doublure
      (make play SCENARIO=…), sur le même contrat que le vrai serveur.

  - id: testbackend-doubles-automaton
    from: bb-testbackend
    to: automaton
    role: implements
    contract: events/match/coach-channel.asyncapi.yaml
    also:
      - api/automaton/openapi.yaml#/paths/~1games
    status: formal
    notes: >
      Vérifié par `make check-automaton` dans bb-testbackend : la même suite
      d'échanges contre la doublure et contre le vrai automaton.

  - id: management-creates-games
    from: management-system
    to: automaton
    role: consumes
    contract: api/automaton/openapi.yaml
    status: formal

  - id: automaton-fetches-teams
    from: automaton
    to: management-system
    role: consumes
    contract: null
    status: informal
    notes: >
      Port ManagementSystem.fetch_team (bloodbowl/api/management_system.py),
      servi par un faux en mémoire. Le contrat du vrai système reste à écrire.

  - id: automaton-reads-rules
    from: automaton
    to: kreek-references
    role: reads
    contract: null
    status: informal
    notes: >
      Clone non figé (make fetch_rules suit la branche). Le manifeste en fixe
      le SHA ; scripts/workspace le monte à cet SHA.
